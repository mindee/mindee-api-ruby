#
# Run static code analysis.
#
name: Static Analysis

on:
  workflow_call:
  workflow_dispatch:

jobs:
  linting:
    name: Run Static Analysis
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
        # Betterleaks scans git history across refs, so it needs the full
        # history rather than the default shallow clone.
        fetch-depth: 0

    - name: set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.2.0"
        bundler-cache: true

    - name: Run Betterleaks
      id: betterleaks
      continue-on-error: true
      # version 0.1.0
      uses: dortort/betterleaks-action@cd0b905aa4befb8f42f8b1ab98150180c9e77515
      with:
        version: "v1.9.0"
        scan-mode: git
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Betterleaks report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: betterleaks-report
        path: betterleaks-report.sarif
        if-no-files-found: warn

    - name: Fail if Betterleaks found leaks
      if: steps.betterleaks.outcome == 'failure'
      run: exit 1

    - name: Run all static analysis
      # version 3.0.1
      uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204
      env:
        SKIP: betterleaks
