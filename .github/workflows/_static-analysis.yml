#
# Run static code analysis.
#
name: Static Analysis

on:
  workflow_call:
  workflow_dispatch:

jobs:
  linting:
    name: Run Static Analysis
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.2.0"
        bundler-cache: true

    - name: Run all static analysis
      # version 3.0.1
      uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204
      env:
        # betterleaks is run in a separate workflow
        SKIP: betterleaks
